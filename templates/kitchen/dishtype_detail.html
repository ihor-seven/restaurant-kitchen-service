{% extends "layouts/base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>Dish Type Detail</h2>
  <p><strong>Name:</strong> {{ object.name }}</p>

  {% if user.is_authenticated %}
    <a href="{% url 'kitchen:dishtype-update' object.id %}" class="btn btn-warning">Edit</a>
    <a href="{% url 'kitchen:dishtype-delete' object.id %}" class="btn btn-danger">Delete</a>
  {% endif %}

  <a href="{% url 'kitchen:dishtype-list' %}" class="btn btn-secondary">Back to list</a>
</div>
{% endblock %}
