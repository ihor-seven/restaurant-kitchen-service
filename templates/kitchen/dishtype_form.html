{% extends "layouts/base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>{% if object %}Edit Dish Type{% else %}Add Dish Type{% endif %}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'kitchen:dishtype-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
