{% extends "layouts/base.html" %}
{% block content %}
<div class="container mt-4">
  <h2>{{ view.object|default:"New Cook" }}</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="{% url 'kitchen:cook-list' %}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
