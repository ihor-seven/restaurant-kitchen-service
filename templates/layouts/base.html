{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kitchen Service</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'kitchen:index' %}">
        <i class="fa-solid fa-kitchen-set"></i> Kitchen Service
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav w-100 justify-content-evenly">
          <li class="nav-item">
            <a class="nav-link" href="{% url 'kitchen:index' %}">
              <i class="fa-solid fa-gauge"></i> Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'kitchen:dish-list' %}">
              <i class="fa-solid fa-utensils"></i> Dishes
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{% url 'kitchen:cook-list' %}">
              <i class="fa-solid fa-user-chef"></i> Cooks
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="bg-dark text-white text-center py-3 mt-4">
    <p>© 2026 Kitchen Service. All rights reserved.</p>
  </footer>
</body>
</html>
